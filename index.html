<div id="portao"><div class="caixa" id="portao-conteudo"></div></div>

<header id="cab" class="oculto">

<div class="aviso-salvo" id="toast"></div>

<script>
"use strict";

/* =====================================================================
   PARTE 1 — CRIPTOGRAFIA
   Tudo é gravado cifrado com AES-GCM 256. A chave nunca é armazenada:
   é derivada da senha a cada abertura (PBKDF2-SHA256, 600.000 iterações)
   e vive apenas na memória, sendo descartada ao bloquear.
   ===================================================================== */
const ITERACOES = 600000;
const CHAVE_COFRE  = "qp-cofre-v2";      // dados cifrados
const CHAVE_TENTAT = "qp-tentativas";    // controle de força bruta (não sigiloso)
const CHAVE_ANTIGA = "quarto-passo-v1";  // versão sem cifra, para migração

const temCripto = () => !!(window.crypto && window.crypto.subtle && window.isSecureContext);

const bytes  = n => crypto.getRandomValues(new Uint8Array(n));
const paraB64 = u8 => btoa(String.fromCharCode.apply(null, Array.from(u8)));
const deB64   = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function derivar(senha, salt, iters){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(senha), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name:"PBKDF2", salt, iterations:iters, hash:"SHA-256" },
    base, { name:"AES-GCM", length:256 }, false, ["encrypt","decrypt"]);
}
async function cifrar(chave, objeto){
  const iv = bytes(12);
  const dados = new TextEncoder().encode(JSON.stringify(objeto));
  const ct = await crypto.subtle.encrypt({ name:"AES-GCM", iv }, chave, dados);
  return { iv:paraB64(iv), ct:paraB64(new Uint8Array(ct)) };
}
async function decifrar(chave, ivB64, ctB64){
  // Se a senha estiver errada, a etiqueta de autenticação do AES-GCM falha
  // e esta chamada lança exceção. É essa falha que valida a senha.
  const claro = await crypto.subtle.decrypt(
    { name:"AES-GCM", iv:deB64(ivB64) }, chave, deB64(ctB64));
  return JSON.parse(new TextDecoder().decode(claro));
}

/* =====================================================================
   PARTE 2 — DEPÓSITO (onde o texto cifrado é guardado)
   ===================================================================== */
const Deposito = (() => {
  let modo = "memoria", ram = {};
  async function iniciar(){
    if (typeof window.storage !== "undefined" && window.storage){
      try { await window.storage.get(CHAVE_COFRE); } catch(e){}
      modo = "claude"; return modo;
    }
    try { localStorage.setItem("__t","1"); localStorage.removeItem("__t"); modo = "local"; }
    catch(e){ modo = "memoria"; }
    return modo;
  }
  async function ler(k){
    try{
      if (modo === "claude"){ const r = await window.storage.get(k); return r && r.value ? r.value : null; }
      if (modo === "local")  return localStorage.getItem(k);
      return ram[k] || null;
    }catch(e){ return null; }
  }
  async function gravar(k, txt){
    try{
      if (modo === "claude"){ await window.storage.set(k, txt); return true; }
      if (modo === "local"){ localStorage.setItem(k, txt); return true; }
      ram[k] = txt; return true;
    }catch(e){ return false; }
  }
  async function remover(k){
    try{
      if (modo === "claude"){ await window.storage.delete(k); return true; }
      if (modo === "local"){ localStorage.removeItem(k); return true; }
      delete ram[k]; return true;
    }catch(e){ return false; }
  }
  return { iniciar, ler, gravar, remover, get modo(){ return modo; } };
})();

/* =====================================================================
   PARTE 3 — COFRE
   ===================================================================== */
let chaveMestra = null;   // CryptoKey em memória; nula quando bloqueado
let metaCofre   = null;   // { v, salt, iters, iv, ct }

const Cofre = {
  async carregarMeta(){
    const t = await Deposito.ler(CHAVE_COFRE);
    metaCofre = t ? JSON.parse(t) : null;
    return metaCofre;
  },
  existe(){ return !!metaCofre; },

  async criar(senha, estadoInicialObj){
    const salt = bytes(16);
    const chave = await derivar(senha, salt, ITERACOES);
    const { iv, ct } = await cifrar(chave, estadoInicialObj);
    metaCofre = { v:2, salt:paraB64(salt), iters:ITERACOES, iv, ct, criado:new Date().toISOString() };
    await Deposito.gravar(CHAVE_COFRE, JSON.stringify(metaCofre));
    chaveMestra = chave;
    return true;
  },

  async abrir(senha){
    const salt = deB64(metaCofre.salt);
    const chave = await derivar(senha, salt, metaCofre.iters || ITERACOES);
    const dados = await decifrar(chave, metaCofre.iv, metaCofre.ct); // lança se a senha estiver errada
    chaveMestra = chave;
    return dados;
  },

  async gravar(estado){
    if (!chaveMestra) return false;
    const { iv, ct } = await cifrar(chaveMestra, estado);
    metaCofre.iv = iv; metaCofre.ct = ct; metaCofre.atualizado = new Date().toISOString();
    return Deposito.gravar(CHAVE_COFRE, JSON.stringify(metaCofre));
  },

  async trocarSenha(nova, estado){
    const salt = bytes(16);
    const chave = await derivar(nova, salt, ITERACOES);
    const { iv, ct } = await cifrar(chave, estado);
    metaCofre = { v:2, salt:paraB64(salt), iters:ITERACOES, iv, ct,
                  criado:metaCofre.criado, atualizado:new Date().toISOString() };
    await Deposito.gravar(CHAVE_COFRE, JSON.stringify(metaCofre));
    chaveMestra = chave;
    return true;
  },

  async destruir(){
    await Deposito.remover(CHAVE_COFRE);
    await Deposito.remover(CHAVE_TENTAT);
    await Deposito.remover(CHAVE_ANTIGA);
    chaveMestra = null; metaCofre = null;
  }
};

/* ---- Controle de tentativas (atraso progressivo) ---- */
const Tentativas = {
  async ler(){
    const t = await Deposito.ler(CHAVE_TENTAT);
    return t ? JSON.parse(t) : { n:0, ate:0 };
  },
  async errou(){
    const t = await this.ler(); t.n++;
    // Duas tentativas livres (erro de digitação acontece).
    // Da terceira em diante a espera cresce: 5s, 15s, 45s, 2min, 5min (teto).
    const escala = [0,0,0,5,15,45,120,300];
    const seg = escala[Math.min(t.n, escala.length - 1)];
    t.ate = seg ? Date.now() + seg*1000 : 0;
    await Deposito.gravar(CHAVE_TENTAT, JSON.stringify(t));
    return t;
  },
  async zerar(){ await Deposito.gravar(CHAVE_TENTAT, JSON.stringify({ n:0, ate:0 })); }
};

/* =====================================================================
   PARTE 4 — ESTADO DO INVENTÁRIO
   ===================================================================== */
function estadoInicial(){
  return { versao:2, criadoEm:new Date().toISOString(), ultima:"ressentimentos", travaMin:2,
    ressentimentos:[], medos:[], medosMarcados:[], medosTexto:{},
    conduta:[], danos:[], linhaVida:{}, areas:{},
    defeitos:[], defeitosEpisodios:[], qualidades:[],
    guardado:{ itens:[], texto:{} }, sintese:{}, checklist:[] };
}
let E = estadoInicial();
let rota = { secao:"inicio", param:null };
let destrancado = false;

let pendente = null;
function salvar(silencioso){
  if (!destrancado) return;
  clearTimeout(pendente);
  pendente = setTimeout(async () => {
    const ok = await Cofre.gravar(E);
    if (!silencioso) toast(ok ? "Salvo" : "Não foi possível salvar");
  }, 400);
}
async function salvarJa(){
  clearTimeout(pendente);
  if (destrancado) await Cofre.gravar(E);
}
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("ver");
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove("ver"), 1800);
}

/* =====================================================================
   PARTE 5 — BLOQUEIO
   ===================================================================== */
let ocioso = null, saiuEm = 0;

function reiniciarOcioso(){
  clearTimeout(ocioso);
  if (!destrancado) return;
  const min = E.travaMin == null ? 2 : E.travaMin;
  if (min === 0) return;                       // 0 = só bloqueia ao sair
  ocioso = setTimeout(() => bloquear("Bloqueado por inatividade."), min * 60000);
}

async function bloquear(motivo){
  await salvarJa();
  chaveMestra = null;            // descarta a chave
  E = estadoInicial();           // limpa o texto claro da memória
  destrancado = false;
  clearTimeout(ocioso);
  document.getElementById("tela").innerHTML = "";
  ["cab","tela","barra"].forEach(i => document.getElementById(i).classList.add("oculto"));
  telaDestrancar(motivo);
}

document.addEventListener("visibilitychange", () => {
  if (!destrancado) return;
  if (document.visibilityState === "hidden"){ saiuEm = Date.now(); salvarJa(); }
  else {
    const min = E.travaMin == null ? 2 : E.travaMin;
    const limite = min === 0 ? 0 : min * 60000;
    if (Date.now() - saiuEm >= limite) bloquear("O app foi bloqueado enquanto estava em segundo plano.");
    else reiniciarOcioso();
  }
});
["pointerdown","keydown","input"].forEach(ev =>

function progresso(id){
  const pc = (f,a) => Math.max(0, Math.min(100, Math.round(100*f/a)));
  switch(id){
    case "ressentimentos": {
      const l = E.ressentimentos; if(!l.length) return 0;
      const c = l.filter(r => (r.parte||"").trim()).length;
      return pc(Math.min(l.length,5)/5*50 + c/l.length*50, 100);
    }
    case "medos": {
      const a = E.medosMarcados.length ? 40 : 0;
      const c = ["m1","m2","m3","m4"].filter(k => (E.medosTexto[k]||"").trim()).length;
      return pc(a + c/4*40 + (E.medos.length?20:0), 100);
    }
    case "conduta": return pc(Math.min(E.conduta.length,4),4);
    case "danos":   return pc(Math.min(E.danos.length,5),5);
    case "linhavida": {
      const t = LINHA_VIDA.reduce((s,g)=>s+g.qs.length,0);
      return pc(Object.keys(E.linhaVida).filter(k=>(E.linhaVida[k]||"").trim()).length, t);
    }
    case "areas": return pc(Object.keys(E.areas).length, AREAS.length);
    case "caracter": {
      const d = E.defeitos.length?34:0, q = E.qualidades.length?33:0;
      return pc(d+q+Math.min(E.defeitosEpisodios.length,3)/3*33, 100);
    }
    case "guardado": return pc(Object.keys(E.guardado.texto).filter(k=>(E.guardado.texto[k]||"").trim()).length, GUARDADO_ITENS.length);
    case "sintese":  return pc(Object.keys(E.sintese).filter(k=>(E.sintese[k]||"").trim()).length, SINTESE_EIXOS.length);
    case "quintopasso": return pc(E.checklist.length, CHECKLIST.length);
  }
  return 0;
}
const progressoGeral = () => Math.round(PARTES.reduce((s,p)=>s+progresso(p.id),0)/PARTES.length);

/* =====================================================================
   PARTE 9 — TELAS DO PORTÃO
   ===================================================================== */
function forcaSenha(s){
  if(!s) return { n:0, rot:"", cor:"#888" };
  let p = 0;
  p += Math.min(s.length, 24) * 2.6;
  if(/[a-z]/.test(s)) p += 5;
  if(/[A-Z]/.test(s)) p += 6;
  if(/[0-9]/.test(s)) p += 6;
  if(/[^A-Za-z0-9]/.test(s)) p += 9;
  if(s.trim().split(/\s+/).length >= 3) p += 14;         // frases longas valem muito
  if(/^[0-9]+$/.test(s)) p -= 22;                        // só números é fraco
  if(/(.)\1{2,}/.test(s)) p -= 10;
  p = Math.max(0, Math.min(100, Math.round(p)));
  const r = p<35 ? ["Fraca","#E08A8A"] : p<60 ? ["Razoável","#E0C07A"] : p<80 ? ["Boa","#9FD3A8"] : ["Muito boa","#7BC98A"];
  return { n:p, rot:r[0], cor:r[1] };
}

async function telaDestrancar(motivo){
  const t = await Tentativas.ler();
  const espera = Math.max(0, Math.ceil((t.ate - Date.now())/1000));
  portao(`${emblema(74,"#FFFFFF")}
    <h2>Seu inventário está trancado</h2>
    ${motivo ? `<p>${esc(motivo)}</p>` : `<p>Digite sua senha para abrir.</p>`}
    ${espera ? `<div class="erro" id="espera">Muitas tentativas. Aguarde <b id="cont">${espera}</b> segundos.</div>` : ""}
    ${t.n && !espera ? `<div class="erro">${t.n} tentativa${t.n>1?"s":""} sem sucesso até agora.</div>` : ""}
    <label><span>Senha</span><input type="password" id="sen" autocomplete="current-password" autocapitalize="off" spellcheck="false" ${espera?"disabled":""}></label>
    <button class="btn" data-acao="abrir-cofre" id="btn-abrir" ${espera?"disabled":""}>Abrir</button>
    <button class="btn linha2" data-acao="esqueci">Esqueci minha senha</button>`);
  if (espera){
    let n = espera;
    const iv = setInterval(() => {
      n--;
      const c = document.getElementById("cont");
      if(!c){ clearInterval(iv); return; }
      if(n <= 0){ clearInterval(iv); telaDestrancar(motivo); } else c.textContent = n;
    }, 1000);
  } else {
    const s = document.getElementById("sen");
    s.focus();
    s.addEventListener("keydown", e => { if(e.key === "Enter") abrirCofre(); });
  }
}

/* =====================================================================
   PARTE 11 — TEXTO PARA LEITURA
   ===================================================================== */
function montarTexto(){
  const L = [];
  const tit = t => { L.push("", "═══ " + t.toUpperCase() + " ═══", ""); };
  const par = (r,v) => { if(v && String(v).trim()) L.push(r + ": " + v); };
  L.push("MEU QUARTO PASSO", "Inventário moral — " + new Date().toLocaleDateString("pt-BR"));

  tit("1. Ressentimentos");
  E.ressentimentos.length || L.push("(nada registrado)");
  E.ressentimentos.forEach((r,i)=>{
    L.push("— " + (i+1) + ". " + (r.quem||"sem nome"));
    par("   O que aconteceu", r.oque);
    par("   O que atingiu", (r.atinge||[]).join(", "));
    if((r.parte||"").trim()) par("   Minha parte", r.parte);
    else L.push("   Minha parte: [AINDA EM BRANCO — reveja antes do Quinto Passo]");
    L.push("");
  });

  tit("2. Medos");
  if(E.medosMarcados.length) L.push("Marcados: " + E.medosMarcados.join(", "), "");
  [["O maior medo da minha vida","m1"],["Começou quando","m2"],
   ["Por causa dele deixo de","m3"],["Sem ele eu","m4"]].forEach(([r,k])=>par(r, E.medosTexto[k]));
  E.medos.forEach(m=>{ L.push("", "— " + (m.nome||"sem nome"));
    par("   De onde veio", m.origem); par("   O que me faz fazer", m.efeito);
    if(m.peso!=null) par("   Peso hoje", m.peso + " de 5"); });

  tit("3. Conduta afetiva");
  E.conduta.length || L.push("(nada registrado)");
  E.conduta.forEach(c=>{ L.push("— " + (c.quem||"sem nome"));
    par("   O que fiz", c.oque); par("   Dano", c.dano); par("   Raiz", c.raiz); L.push(""); });

  tit("4. Danos causados");
  E.danos.length || L.push("(nada registrado)");
  E.danos.forEach(d=>{ L.push("— " + (d.quem||"sem nome"));
    par("   O que fiz", d.oque); par("   Reparável", d.reparo); L.push(""); });

  tit("5. Linha da vida");
  LINHA_VIDA.forEach(g=>{
    const r = g.qs.filter(q=>(E.linhaVida[q[0]]||"").trim());
    if(!r.length) return;
    L.push("· " + g.g, "");
    r.forEach(q=>L.push(q[1], "  " + E.linhaVida[q[0]], ""));
  });

  tit("6. Áreas da vida");
  AREAS.forEach((a,i)=>{ if(E.areas[i]!=null) L.push(a + ": " + E.areas[i] + " de 5"); });

  tit("7. Defeitos e qualidades");
  if(E.defeitos.length) L.push("Defeitos: " + E.defeitos.join(", "), "");
  E.defeitosEpisodios.forEach(e=>{ L.push("— " + (e.defeito||"sem defeito"));
    par("   Episódio", e.episodio); par("   Quem se machucou", e.quem);
    par("   O que eu temia ou queria", e.raiz); L.push(""); });
  if(E.qualidades.length) L.push("Qualidades: " + E.qualidades.join(", "));

  tit("8. O que nunca contei");
  GUARDADO_ITENS.forEach(i=>par(i[1], E.guardado.texto[i[0]]));

  tit("9. Síntese");
  SINTESE_EIXOS.forEach(s=>{ if((E.sintese[s[0]]||"").trim()) L.push(s[1] + ":", "  " + E.sintese[s[0]], ""); });

  return L.join("\n");
}

const TITULOS = {
  inicio:["Quarto Passo","Inventário moral"], ressentimentos:["Ressentimentos","Parte 1"],
  editarRes:["Ressentimento","Parte 1"], medos:["Medos","Parte 2"], editarMedo:["Medo","Parte 2"],
  conduta:["Conduta afetiva","Parte 3"], editarCond:["Registro","Parte 3"],
  danos:["Danos causados","Parte 4"], editarDano:["Pessoa prejudicada","Parte 4"],
  linhavida:["Linha da vida","Parte 5"], areas:["Áreas da vida","Parte 6"],
  caracter:["Defeitos e qualidades","Parte 7"], editarEpi:["Episódio","Parte 7"],
  guardado:["O que nunca contei","Parte 8"], sintese:["Síntese","Parte 9"],
  quintopasso:["Quinto Passo","Parte 10"], leitura:["Meu inventário","Texto aberto"], ajustes:["Ajustes",""]
};
const VOLTA = { editarRes:"ressentimentos", editarMedo:"medos", editarCond:"conduta",
  editarDano:"danos", editarEpi:"caracter", leitura:"quintopasso" };
const PARTE_IDS = ["ressentimentos","medos","conduta","danos","linhavida","areas","caracter","guardado","sintese"];

function ir(secao, param){
  if(!destrancado) return;
  if(PARTE_IDS.includes(secao) && E.ultima !== secao){ E.ultima = secao; salvar(true); }
  rota = { secao, param:param||null };
  render();
  window.scrollTo(0,0);
}

function render(){
  if(!destrancado) return;
  document.getElementById("tela").innerHTML = (Telas[rota.secao] || Telas.inicio)();
  const [t,s] = TITULOS[rota.secao] || ["Quarto Passo",""];
  document.getElementById("cab-tit").textContent = t;
  document.getElementById("cab-sub").textContent = s;
  document.getElementById("cab").classList.toggle("interna", rota.secao !== "inicio");

  const abas = [
    ["inicio","Início",'<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/>'],
    [E.ultima || "ressentimentos","Escrever",'<path d="M4 20h16"/><path d="M14.5 4.5a2.1 2.1 0 0 1 3 3L8 17l-4 1 1-4Z"/>'],
    ["quintopasso","5.º Passo",'<path d="M20 6 9 17l-5-5"/>'],
    ["ajustes","Ajustes",'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1 2 2 0 1 1-4 0 1.6 1.6 0 0 0-2.7-1.1l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.6 1.6 0 0 0 3 15a2 2 0 1 1 0-4 1.6 1.6 0 0 0 1.5-2.6l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.6 1.6 0 0 0 10 4.6a2 2 0 1 1 4 0 1.6 1.6 0 0 0 2.7 1.1l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1A1.6 1.6 0 0 0 21 11a2 2 0 1 1 0 4Z"/>']
  ];
  const atual = rota.secao==="inicio" ? "inicio" : rota.secao==="ajustes" ? "ajustes"
    : (rota.secao==="quintopasso"||rota.secao==="leitura") ? "quintopasso" : (E.ultima||"ressentimentos");
  document.getElementById("barra").innerHTML = abas.map(([id,r,d])=>
    `<button data-acao="ir" data-valor="${id}" ${atual===id?'aria-current="page"':""}>
      <svg viewBox="0 0 24 24">${d}</svg>${r}</button>`).join("");
}

function entrar(){
  destrancado = true;
  document.getElementById("portao").classList.remove("ver");
  document.getElementById("portao-conteudo").innerHTML = "";   // não deixa a senha no DOM
  ["cab","tela","barra"].forEach(i=>document.getElementById(i).classList.remove("oculto"));
  rota = { secao:"inicio", param:null };
  render();
  reiniciarOcioso();
}

/* =====================================================================
   PARTE 13 — AÇÕES DO PORTÃO
   ===================================================================== */
async function criarCofre(migrando){
  const s1 = document.getElementById("s1").value;
  const s2 = document.getElementById("s2").value;
  if(s1.length < 8) return (migrando?telaMigrar:telaCriar)("A senha precisa de pelo menos 8 caracteres.");
  if(s1 !== s2)     return (migrando?telaMigrar:telaCriar)("As duas senhas não conferem.");
  if(forcaSenha(s1).n < 30) return (migrando?telaMigrar:telaCriar)("Essa senha é fraca demais para este conteúdo. Use uma frase de três ou mais palavras.");

  const btn = document.querySelector('[data-acao="'+(migrando?"migrar":"criar-cofre")+'"]');
  if(btn){ btn.disabled = true; btn.textContent = "Cifrando…"; }

  let base = estadoInicial();
  if(migrando){
    const antigo = await Deposito.ler(CHAVE_ANTIGA);
    if(antigo){ try{ base = Object.assign(estadoInicial(), JSON.parse(antigo)); }catch(e){} }
    base.versao = 2; delete base.pin;
  }
  await Cofre.criar(s1, base);
  if(migrando) await Deposito.remover(CHAVE_ANTIGA);
  await Tentativas.zerar();
  E = base;
  entrar();
  toast(migrando ? "Inventário cifrado" : "Cofre criado");
}

async function abrirCofre(){
  const campo = document.getElementById("sen");
  if(!campo) return;
  const senha = campo.value;
  if(!senha) return;
  const btn = document.getElementById("btn-abrir");
  if(btn){ btn.disabled = true; btn.textContent = "Abrindo…"; }
  campo.disabled = true;
  try{
    const dados = await Cofre.abrir(senha);
    await Tentativas.zerar();
    E = Object.assign(estadoInicial(), dados);
    entrar();
  }catch(e){
    await Tentativas.errou();
    telaDestrancar("Senha incorreta.");
  }
}

/* =====================================================================
   PARTE 14 — AÇÕES DO APP
   ===================================================================== */
const alterna = (arr,v) => { const i = arr.indexOf(v); if(i>=0) arr.splice(i,1); else arr.push(v); };
const achar = (l,id) => l.find(x=>x.id===id);

function baixar(nome, texto, tipo){
  const b = new Blob([texto], { type:tipo || "application/json" });
  const u = URL.createObjectURL(b), a = document.createElement("a");
  a.href = u; a.download = nome; document.body.appendChild(a); a.click();
  document.body.removeChild(a); setTimeout(()=>URL.revokeObjectURL(u), 1500);
}

document.addEventListener("click", async ev => {
  const el = ev.target.closest("[data-acao]");
  if(!el) return;
  const a = el.dataset.acao, v = el.dataset.valor;

  /* --- portão --- */
  if(a === "criar-cofre") return criarCofre(false);
  if(a === "migrar")      return criarCofre(true);
  if(a === "abrir-cofre") return abrirCofre();
  if(a === "esqueci"){
    alert("Não há como recuperar a senha.\n\nO inventário é cifrado com ela, e a senha não fica gravada em lugar nenhum — nem neste aparelho, nem em qualquer servidor. Sem ela, o conteúdo é matematicamente inacessível.\n\nSe você tem uma cópia de segurança e lembra da senha dela, restaure-a. Caso contrário, a única saída é apagar tudo e recomeçar, o que se faz reinstalando o app.");
    return;
  }
  if(!destrancado) return;

  /* --- navegação --- */
  if(a === "ir"){ ir(v); return; }

  /* --- ressentimentos --- */
  if(a === "novo-res"){ const r={id:uid(),atinge:[]}; E.ressentimentos.unshift(r); salvar(true); ir("editarRes", r.id); return; }
  if(a === "edit-res"){ ir("editarRes", v); return; }
  if(a === "del-res"){ if(confirm("Excluir este ressentimento?")){ E.ressentimentos = E.ressentimentos.filter(x=>x.id!==v); salvar(); render(); } return; }
  if(a === "res-atinge"){ const r = achar(E.ressentimentos, rota.param); if(r){ r.atinge = r.atinge||[]; alterna(r.atinge, v); salvar(true); render(); } return; }

  /* --- medos --- */
  if(a === "medo-chip"){ alterna(E.medosMarcados, v); salvar(true); render(); return; }
  if(a === "novo-medo"){ const m={id:uid()}; E.medos.unshift(m); salvar(true); ir("editarMedo", m.id); return; }
  if(a === "edit-medo"){ ir("editarMedo", v); return; }
  if(a === "del-medo"){ if(confirm("Excluir este medo?")){ E.medos = E.medos.filter(x=>x.id!==v); salvar(); render(); } return; }
  if(a === "medo-peso"){ const m = achar(E.medos, rota.param); if(m){ m.peso = +v; salvar(true); render(); } return; }

  /* --- conduta --- */
  if(a === "novo-cond"){ const c={id:uid()}; E.conduta.unshift(c); salvar(true); ir("editarCond", c.id); return; }
  if(a === "edit-cond"){ ir("editarCond", v); return; }
  if(a === "del-cond"){ if(confirm("Excluir este registro?")){ E.conduta = E.conduta.filter(x=>x.id!==v); salvar(); render(); } return; }

  /* --- danos --- */
  if(a === "novo-dano"){ const d={id:uid()}; E.danos.unshift(d); salvar(true); ir("editarDano", d.id); return; }
  if(a === "edit-dano"){ ir("editarDano", v); return; }
  if(a === "del-dano"){ if(confirm("Excluir esta pessoa da lista?")){ E.danos = E.danos.filter(x=>x.id!==v); salvar(); render(); } return; }

  /* --- áreas --- */
  if(a.startsWith("area-")){ E.areas[a.slice(5)] = +v; salvar(true); render(); return; }

  /* --- caráter --- */
  if(a === "def-chip"){ alterna(E.defeitos, v); salvar(true); render(); return; }
  if(a === "qual-chip"){ alterna(E.qualidades, v); salvar(true); render(); return; }
  if(a === "novo-epi"){ const e={id:uid()}; E.defeitosEpisodios.unshift(e); salvar(true); ir("editarEpi", e.id); return; }
  if(a === "edit-epi"){ ir("editarEpi", v); return; }
  if(a === "del-epi"){ if(confirm("Excluir este episódio?")){ E.defeitosEpisodios = E.defeitosEpisodios.filter(x=>x.id!==v); salvar(); render(); } return; }

  /* --- quinto passo --- */
  if(a === "chk"){ alterna(E.checklist, +v); salvar(true); render(); return; }
  if(a === "gerar-leitura"){ ir("leitura"); return; }
  if(a === "copiar"){
    try{ await navigator.clipboard.writeText(montarTexto()); toast("Copiado. Apague a área de transferência depois."); }
    catch(e){ toast("Selecione o texto e copie manualmente"); }
    return;
  }
  if(a === "imprimir"){ window.print(); return; }

  /* --- ajustes --- */
  if(a === "trava-min"){ E.travaMin = +v; salvar(); render(); reiniciarOcioso(); return; }

  if(a === "exportar"){
    await salvarJa();
    baixar("quarto-passo-" + new Date().toISOString().slice(0,10) + ".qp",
      JSON.stringify({ tipo:"quarto-passo-cifrado", v:2, salt:metaCofre.salt,
        iters:metaCofre.iters, iv:metaCofre.iv, ct:metaCofre.ct }, null, 2));
    toast("Cópia cifrada baixada");
    return;
  }
  if(a === "exportar-claro"){
    if(!confirm("Este arquivo NÃO terá proteção alguma. Qualquer pessoa que o abrir lerá todo o seu inventário.\n\nContinuar?")) return;
    if(!confirm("Confirma? Use apenas para imprimir e destrua o arquivo em seguida.")) return;
    baixar("quarto-passo-SEM-PROTECAO-" + new Date().toISOString().slice(0,10) + ".txt",
      montarTexto(), "text/plain;charset=utf-8");
    toast("Arquivo sem proteção baixado");
    return;
  }
  if(a === "importar"){ document.getElementById("arq").click(); return; }

  if(a === "trocar-senha"){
    const atual = prompt("Digite sua senha atual:");
    if(atual === null) return;
    try{ await Cofre.abrir(atual); }
    catch(e){ alert("Senha atual incorreta."); return; }
    const nova = prompt("Nova senha (mínimo 8 caracteres, de preferência uma frase):");
    if(nova === null) return;
    if(nova.length < 8 || forcaSenha(nova).n < 30){ alert("Senha muito fraca. Use uma frase de três ou mais palavras."); return; }
    if(prompt("Repita a nova senha:") !== nova){ alert("As senhas não conferem."); return; }
    await Cofre.trocarSenha(nova, E);
    toast("Senha trocada");
    return;
  }

  if(a === "apagar"){
    if(!confirm("Apagar todo o inventário deste aparelho? Não há como desfazer.")) return;
    if(!confirm("Confirma? Se ainda não baixou uma cópia, ela será perdida para sempre.")) return;
    await Cofre.destruir();
    E = estadoInicial(); destrancado = false;
    document.getElementById("tela").innerHTML = "";
    ["cab","tela","barra"].forEach(i=>document.getElementById(i).classList.add("oculto"));
    telaCriar();
    return;
  }
});

/* Bloquear agora */
document.getElementById("btn-travar").addEventListener("click", () => bloquear("Trancado por você."));
document.getElementById("btn-voltar").addEventListener("click", () => ir(VOLTA[rota.secao] || "inicio"));

/* Digitação */
document.addEventListener("input", ev => {
  const el = ev.target.closest("[data-acao]");
  if(!el || !("value" in el) || !destrancado) return;
  const a = el.dataset.acao, v = el.value;
  const R=()=>achar(E.ressentimentos,rota.param), M=()=>achar(E.medos,rota.param),
        Cd=()=>achar(E.conduta,rota.param), D=()=>achar(E.danos,rota.param),
        Ep=()=>achar(E.defeitosEpisodios,rota.param);
  const mapa = {
    "res-quem":()=>{const o=R(); if(o) o.quem=v;}, "res-oque":()=>{const o=R(); if(o) o.oque=v;},
    "res-parte":()=>{const o=R(); if(o) o.parte=v;},
    "medo-nome":()=>{const o=M(); if(o) o.nome=v;}, "medo-origem":()=>{const o=M(); if(o) o.origem=v;},
    "medo-efeito":()=>{const o=M(); if(o) o.efeito=v;},
    "cond-quem":()=>{const o=Cd(); if(o) o.quem=v;}, "cond-oque":()=>{const o=Cd(); if(o) o.oque=v;},
    "cond-dano":()=>{const o=Cd(); if(o) o.dano=v;}, "cond-raiz":()=>{const o=Cd(); if(o) o.raiz=v;},
    "dano-quem":()=>{const o=D(); if(o) o.quem=v;}, "dano-oque":()=>{const o=D(); if(o) o.oque=v;},
    "dano-reparo":()=>{const o=D(); if(o) o.reparo=v;},
    "epi-defeito":()=>{const o=Ep(); if(o) o.defeito=v;}, "epi-episodio":()=>{const o=Ep(); if(o) o.episodio=v;},
    "epi-quem":()=>{const o=Ep(); if(o) o.quem=v;}, "epi-raiz":()=>{const o=Ep(); if(o) o.raiz=v;}
  };
  if(mapa[a]) mapa[a]();
  else if(a.startsWith("medo-m")) E.medosTexto[a.slice(5)] = v;
  else if(a.startsWith("lv-"))    E.linhaVida[a.slice(3)] = v;
  else if(a.startsWith("gu-"))    E.guardado.texto[a.slice(3)] = v;
  else if(a.startsWith("sin-"))   E.sintese[a.slice(4)] = v;
  else return;
  salvar(true);
});

/* Restaurar cópia cifrada */
document.addEventListener("change", ev => {
  if(ev.target.id !== "arq") return;
  const f = ev.target.files[0];
  ev.target.value = "";
  if(!f) return;
  const fr = new FileReader();
  fr.onload = async () => {
    let d;
    try{ d = JSON.parse(fr.result); }
    catch(e){ alert("Arquivo inválido."); return; }
    if(!d || !d.ct || !d.salt || !d.iv){ alert("Este arquivo não é uma cópia cifrada deste app."); return; }
    const senha = prompt("Senha da cópia que você está restaurando:");
    if(senha === null) return;
    try{
      const chave = await derivar(senha, deB64(d.salt), d.iters || ITERACOES);
      const dados = await decifrar(chave, d.iv, d.ct);
      if(!confirm("Restaurar esta cópia? O inventário atual neste aparelho será substituído.")) return;
      E = Object.assign(estadoInicial(), dados);
      await Cofre.gravar(E);      // regrava com a senha ATUAL do aparelho
      ir("inicio");
      toast("Cópia restaurada");
    }catch(e){ alert("Senha incorreta para este arquivo, ou arquivo corrompido."); }
  };
  fr.readAsText(f);
});
